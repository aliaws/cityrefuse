<form id="paymentForm" method="POST" style="display:none"></form>
<script>
window.onmessage = function(e) {
    if (e.data && e.data.action) {
        var f = document.getElementById('paymentForm');
        f.action = e.data.action;
        f.innerHTML = '';
        Object.keys(e.data.params).forEach(function(k) {
            var i = document.createElement('input');
            i.type = 'hidden';
            i.name = k;
            i.value = e.data.params[k];
            f.appendChild(i);
        });
        f.submit();
    }
};
</script>
